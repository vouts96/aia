<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UNIFAI – Choose Survey Option</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .logo-container {
      padding: 20px;
      background-color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container img {
      height: 80px;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 40px;
      background-color: white;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 12px 25px;
      margin: 15px;
      background-color: #0D3B3E;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1em;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #003e74;
    }

    input[type="file"] {
      display: none;
    }

    label.upload-button {
      background-color: #0D3B3E;
      padding: 12px 25px;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      margin: 15px;
      display: inline-block;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <img src="emp.svg" alt="EMP Logo">
    <img src="logo.png" alt="UNIFAI Logo">
    </div>


  <div class="container">
    <h1>Choose How to Start</h1>
    <p>Please choose an option to begin the assessment process:</p>

    <!-- Start a new empty survey -->
    <a href="index.html?lang=en" class="button">Start New Assessment</a>

    <!-- Upload pre-filled survey JSON -->
    <form action="index.html" method="GET" onsubmit="return handleFileUpload(event)">
      <label for="jsonUpload" class="upload-button">Upload Pre-Filled Survey</label>
      <input type="file" id="jsonUpload" accept=".json" />
    </form>
  </div>

  <script>
    function handleFileUpload(event) {
      event.preventDefault();
      const fileInput = document.getElementById('jsonUpload');
      if (!fileInput.files.length) return;

      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = function (e) {
        const content = e.target.result;
        localStorage.setItem('prefilledSurvey', content);
        window.location.href = 'index.html?prefilled=true&lang=en'; // You handle this in index.html
      };
      reader.readAsText(file);
    }

    // Attach click handler manually since form won't be submitted
    document.getElementById('jsonUpload').addEventListener('change', handleFileUpload);
  </script>

</body>
</html>
